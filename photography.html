<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitez Photography</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="logo small square.png">
    <style>
        :root {
            --bg: #000; --fg: #fff; --accent: #ff3e00; --gutter: 1.5rem;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); color: var(--fg); 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden;
            scrollbar-gutter: stable;
            padding-top: 4.5rem;
        }
        
        nav {
            position: fixed; top: 0; left: 0; width: 100%; padding: 1.4rem 2rem;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
            z-index: 9999;
            background: #000;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            pointer-events: auto;
        }
        nav > a.nav-link { justify-self: start; }
        nav > #scroll-wrapper { justify-self: end; }
        #filter-panel { justify-self: center; }
        .nav-link { color: var(--fg); text-decoration: none; font-weight: 900; text-transform: uppercase; font-size: 1.2rem; pointer-events: auto; transition: opacity 0.3s ease;
    display: flex;
    align-items: center;
    gap: 0.6rem; opacity: 0.7; }
    
    .nav-link:hover {
    opacity: 1;
}

.nav-link[href="index.html"] .ui-arrow {
    transform: translateY(-2px);
    margin-right: 2px;
}

.ui-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    line-height: 1;
    height: 1.2rem;
    transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
}

header { padding: 2.5rem 2rem 0 2rem; }
        h1 { font-size: clamp(3rem, 12vw, 9rem); font-weight: 900; line-height: 0.8; letter-spacing: -0.05em; }

        .gallery-wrapper {
            display: flex;
            padding: 4rem var(--gutter) 10rem var(--gutter);
            gap: var(--gutter);
            align-items: flex-start;
        }

        .column { flex: 1; display: flex; flex-direction: column; gap: var(--gutter); }

        .photo-item {
            width: 100%;
            background: #1a1a1a;
            position: relative;
            overflow: hidden;
            cursor: zoom-in;
            border: 1px solid #2a2a2a;
        }

        .photo-item img {
            width: 100%; height: auto; display: block;
            opacity: 0; filter: grayscale(100%);
            transform: scale(1);
            transition: opacity 0.8s ease-out, filter 0.4s ease, transform 0.5s ease;
        }
        
        .photo-item img.loaded { opacity: 1; }
        .photo-item:hover img { filter: grayscale(0%); transform: scale(1.05); }

        .photo-info {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 1.5rem; font-size: 1.0rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.1em;
            color: #fff; background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            z-index: 2; opacity: 0; transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none; font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: space-between; 
            align-items: center;
            gap: 2rem;
        }
        
        .photo-id {
            flex-shrink: 0;
        }
        
        .photo-details {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.2rem;
            flex: 1;
            min-width: 0;
        }
        
        .photo-location {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: right;
        }
        
        .photo-date {
            flex-shrink: 0;
            opacity: 0.7;
            font-size: 0.85em;
        }
        
        .photo-item:hover .photo-info { opacity: 1; transform: translateY(0); }
        
        #progress { position: fixed; bottom: 0; height: 2px; background: var(--accent); width: 0%; z-index: 10000; transition: width 0.3s ease-out; }

        /* Lightbox */
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); display: flex;
            align-items: center; justify-content: center;
            z-index: 20000; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease; cursor: zoom-out;
            overflow: hidden;
        }
        .lightbox.active { opacity: 1; pointer-events: auto; }

        #lb-track {
            display: flex;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
        }
        .lb-slide {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .lb-slide img {
            max-width: 90%; max-height: 90vh;
            transform: scale(0.95); transition: transform 0.4s ease;
        }
        .lightbox.active .lb-slide img { transform: scale(1); }

        /* Desktop: simple centered single image, no carousel track */
        #lb-track {
            width: 100%;
            justify-content: center;
        }
        #lb-slide-prev, #lb-slide-next {
            display: none;
        }
        #lb-slide-current {
            width: 100%;
            height: 100%;
        }

        @keyframes swipeHint {
            0%   { transform: scale(1) translateX(0); }
            20%  { transform: scale(1) translateX(-22px); }
            45%  { transform: scale(1) translateX(10px); }
            65%  { transform: scale(1) translateX(-8px); }
            100% { transform: scale(1) translateX(0); }
        }
        .lb-slide img.swipe-hint {
            animation: swipeHint 1.1s ease-in-out 0.5s 1;
        }
        
        
        
  .lightbox-ui {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 20001;
    pointer-events: none;
}

#lb-share-btn {
    pointer-events: auto;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 0.5rem 1rem;
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.3s ease;
}

#lb-share-btn:hover {
    background: #fff;
    color: #000;
}

#lb-share-btn.copied {
    border-color: var(--accent);
    color: var(--accent);
}

.lb-nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20002;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 3.5rem;
    line-height: 1;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    width: 4rem;
    height: 4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.2s ease;
    pointer-events: auto;
}
.lb-nav-btn:hover { opacity: 1; }
.lb-nav-btn.lb-prev { left: 0.5rem; }
.lb-nav-btn.lb-next { right: 0.5rem; }
.lb-nav-btn:disabled {
    opacity: 0.15;
    cursor: default;
}

@media (max-width: 800px) {
    .lb-nav-btn {
        display: none;
    }

    /* Mobile: real carousel track with prev/current/next slides side by side */
    #lb-track {
        width: 300vw;
        height: 100%;
        transform: translateX(-100vw); /* center slide (current) in view */
    }
    #lb-slide-prev, #lb-slide-next {
        display: flex;
    }
    .lb-slide {
        width: 100vw;
        height: 100%;
    }
    #lb-slide-current {
        width: 100vw;
    }
}
        
        
        /* --- THE MOBILE SCROLL REVEAL FIX --- */
@media (max-width: 800px) {
    /* 1. Ensure the info is hidden by default on mobile */
    .photo-info {
        opacity: 0;
        transform: translateY(15px);
        transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.2, 1, 0.3, 1);
        font-size: 0.75rem;
        padding: 1rem;
    }
    
    .photo-date {
        font-size: 0.7rem;
    }

    /* 2. When the JS adds 'is-focused', reveal the info and color */
    .photo-item.is-focused .photo-info {
        opacity: 1;
        transform: translateY(0);
    }
    
    header {
        padding: 1.5rem 1.5rem 0 1.5rem;
    }
    h1 {
        line-height: 1.0;
    }

    .photo-item.is-focused img {
        filter: grayscale(0%) !important;
        transform: scale(1.02);
    }
}

        @media (max-width: 800px) {
            .gallery-wrapper { gap: 1rem; padding: 2rem 1rem; }
            #col-2 { display: none; }
        }
        @media (max-width: 500px) {
            #col-1 { display: none; }
        }
        
        .nav-link[href="index.html"]:hover {
    color: #ccc;
        }
#scroll-wrapper {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    font-size: 1.2rem;
}

#scroll-wrapper.is-reversed #scroll-arrow {
    transform: rotate(180deg);
}

/* Filter Menu — lives inline in nav, same blend-mode menu treatment */
#filter-panel {
    display: flex;
    align-items: center;
    gap: 1.3rem;
    pointer-events: auto;
}

.filter-btn {
    background: transparent;
    border: none;
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    font-size: 1.2rem;
    text-transform: uppercase;
    letter-spacing: normal;
    cursor: pointer;
    padding: 0;
    opacity: 0.7;
    transition: opacity 0.3s ease, color 0.2s ease;
    white-space: nowrap;
}

.filter-btn:hover { opacity: 1; }
.filter-btn.active { opacity: 1; color: var(--accent); }

.filter-year-group {
    display: flex;
    align-items: center;
    gap: 0.9rem;
}

.filter-months {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    overflow: hidden;
    max-width: 0;
    transition: max-width 0.4s cubic-bezier(0.19, 1, 0.22, 1);
}

.filter-year-group.open .filter-months {
    max-width: 500px;
}

.filter-btn.month {
    font-size: 0.85rem;
    opacity: 0.5;
}

.filter-btn.month:hover { opacity: 0.85; }
.filter-btn.month.active { opacity: 1; color: var(--accent); }

.filter-btn.all {
    padding-right: 1.1rem;
    border-right: 1px solid rgba(255,255,255,0.3);
}

/* Slide-in entrance for ALL + year buttons on load */
.filter-btn.all,
.filter-year-group {
    opacity: 0;
    transform: translateX(-20px);
    animation: navSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes navSlideIn {
    from {
        opacity: 0;
        transform: translateX(-20px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

    display: none;
    background: transparent;
    border: none;
    color: var(--fg);
    padding: 0.3rem;
    cursor: pointer;
    opacity: 0.7;
    pointer-events: auto;
    align-items: center;
    gap: 0.5rem;
}
#mobile-filter-trigger:hover,
#mobile-filter-trigger.active { opacity: 1; }

#mobile-filter-label {

.trigger-icon-wrap {

#sheet-backdrop {

#filter-sheet {

<script>
// Intersection Observer for Mobile Focus (Automatic hover on scroll)
    const mobileObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('is-focused');
            } else {
                entry.target.classList.remove('is-focused');
            }
        });
    }, {
        rootMargin: "-40% 0% -40% 0%",
        threshold: 0.1
    });



    // All photo data stored globally for filtering
    let allPhotos = [];
    let activeFilter = { year: null, month: null };
    let currentGalleryPhotos = []; // photos currently rendered, in reading order
    let currentLightboxIndex = -1;
    let programmaticHashChangeCount = 0; // counts pending self-triggered hash changes, to avoid re-triggering on rapid swipes
    let lastSwipeHintTime = 0; // timestamp of last swipe-hint play, to throttle re-showing it
    const SWIPE_HINT_COOLDOWN_MS = 30000;

    const MONTH_ORDER = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

    // Concurrency-limited image loading queue, so a fast scroll doesn't fire
    // dozens of simultaneous requests that drown out what's actually visible.
    const MAX_CONCURRENT_LOADS = 4;
    let activeLoads = 0;
    const loadQueue = []; // array of {img, priority} - lower priority = closer to viewport

    function enqueueImageLoad(img, priority) {
        // Avoid duplicate entries if re-queued
        const existing = loadQueue.find(q => q.img === img);
        if (existing) {
            existing.priority = priority;
        } else {
            loadQueue.push({ img, priority });
        }
        processLoadQueue();
    }

    function processLoadQueue() {
        if (activeLoads >= MAX_CONCURRENT_LOADS || loadQueue.length === 0) return;
        loadQueue.sort((a, b) => a.priority - b.priority);
        const next = loadQueue.shift();
        const img = next.img;
        if (!img.dataset.src) { processLoadQueue(); return; } // already loaded/cancelled

        activeLoads++;
        const src = img.dataset.src;
        delete img.dataset.src;
        img.onload = img.onerror = () => {
            img.classList.add('loaded');
            activeLoads--;
            processLoadQueue();
        };
        img.src = src;
        processLoadQueue(); // try to fill remaining concurrency slots
    }

    const lazyObserver = new IntersectionObserver((entries, obs) => {
        const viewportCenter = window.innerHeight / 2;
        entries.forEach(entry => {
            const img = entry.target;
            if (entry.isIntersecting && img.dataset.src) {
                const priority = Math.abs(entry.boundingClientRect.top + entry.boundingClientRect.height / 2 - viewportCenter);
                enqueueImageLoad(img, priority);
                obs.unobserve(img);
            }
        });
    }, { rootMargin: '1200px 0px 100px 0px', threshold: 0.01 });

    function openLightbox(photos, index, isFreshOpen = true, skipTrackReset = false) {
        const photoData = photos[index];
        if (!photoData) return;

        currentGalleryPhotos = photos;
        currentLightboxIndex = index;

        const { filename, location, date, archiveNumber } = photoData;
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const track = document.getElementById('lb-track');
        const prevImg = document.querySelector('#lb-slide-prev img');
        const nextImg = document.querySelector('#lb-slide-next img');

        document.getElementById('lb-number').textContent = `№ ${archiveNumber}`;
        document.getElementById('lb-meta').textContent = `${location} — ${date}`;

        if (!skipTrackReset) {
            // Reset any drag state on the track
            track.style.transition = 'none';
            track.style.transform = '';
            requestAnimationFrame(() => { track.style.transition = ''; });
        } else {
            // Swipe-driven navigation: the track is already mid/end of its slide-out
            // animation (e.g. at -200vw). Let it finish animating home to -100vw
            // on its own via the transition already in flight, rather than snapping it.
            requestAnimationFrame(() => {
                track.style.transform = 'translateX(-100vw)';
            });
        }

        lightboxImg.style.transition = '';
        lightboxImg.style.transform = '';
        lightboxImg.classList.remove('swipe-hint');
        lightboxImg.src = `images/${filename}`;

        // Populate adjacent slides for the mobile carousel
        const prevPhoto = photos[index - 1];
        const nextPhoto = photos[index + 1];
        prevImg.src = prevPhoto ? `images/${prevPhoto.filename}` : '';
        nextImg.src = nextPhoto ? `images/${nextPhoto.filename}` : '';

        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';

        const newHash = '#' + filename;
        if (window.location.hash !== newHash) {
            programmaticHashChangeCount++;
            window.location.hash = filename;
        }
        updateLightboxNavButtons();
        preloadNeighborPhotos(photos, index);

        // Show the swipe hint only when freshly opened, not on prev/next nav, and not too recently shown
        const now = Date.now();
        if (isFreshOpen && window.innerWidth <= 800 && currentGalleryPhotos.length > 1
            && (now - lastSwipeHintTime) > SWIPE_HINT_COOLDOWN_MS) {
            lastSwipeHintTime = now;
            requestAnimationFrame(() => {
                lightboxImg.classList.add('swipe-hint');
            });
        }
    }

    // Preload full-size images for the next/prev photos so navigation feels instant
    const preloadedImages = new Set();
    function preloadNeighborPhotos(photos, index) {
        const toPreload = [index - 1, index + 1, index + 2, index - 2];
        toPreload.forEach(i => {
            const photo = photos[i];
            if (!photo) return;
            const src = `images/${photo.filename}`;
            if (preloadedImages.has(src)) return;
            preloadedImages.add(src);
            const img = new Image();
            img.src = src;
        });
    }

    function updateLightboxNavButtons() {
        const prevBtn = document.getElementById('lb-prev');
        const nextBtn = document.getElementById('lb-next');
        prevBtn.disabled = currentLightboxIndex <= 0;
        nextBtn.disabled = currentLightboxIndex >= currentGalleryPhotos.length - 1;
    }

    function showLightboxAt(newIndex, skipTrackReset = false) {
        if (newIndex < 0 || newIndex >= currentGalleryPhotos.length) return;
        openLightbox(currentGalleryPhotos, newIndex, false, skipTrackReset);
    }

    function renderGallery(photos) {
        const allColumns = [
            document.getElementById('col-0'), 
            document.getElementById('col-1'), 
            document.getElementById('col-2')
        ];

        // Clear columns
        allColumns.forEach(col => col.innerHTML = '');

        const columns = allColumns.filter(col => getComputedStyle(col).display !== 'none');
        let columnHeights = new Array(columns.length).fill(0);

        photos.forEach((photoData, index) => {
            const { filename, ratio, location, date, archiveNumber } = photoData;

            const item = document.createElement('div');
            item.className = 'photo-item';
            item.style.aspectRatio = 1 / ratio;

            const isInitial = index < 12;

            item.innerHTML = `
                <img ${isInitial ? `src="images/${filename}"` : `data-src="images/${filename}"`} 
                     class="${isInitial ? 'loaded' : ''}"
                     decoding="async"
                     alt="Photo">
                <div class="photo-info">
                    <span class="photo-id">№ ${archiveNumber}</span>
                    <div class="photo-details">
                        <span class="photo-location">${location}</span>
                        <span class="photo-date">${date}</span>
                    </div>
                </div>
            `;

            item.addEventListener('click', () => {
                openLightbox(photos, index);
            });

            const shortestColumnIndex = columnHeights.indexOf(Math.min(...columnHeights));
            columns[shortestColumnIndex].appendChild(item);
            columnHeights[shortestColumnIndex] += ratio;

            mobileObserver.observe(item);
            if (!isInitial) {
                const targetImg = item.querySelector('img');
                lazyObserver.observe(targetImg);
            }
        });
    }

    function applyFilter() {
        let filtered = allPhotos;
        if (activeFilter.year) {
            filtered = filtered.filter(p => p.year === activeFilter.year);
        }
        if (activeFilter.month) {
            filtered = filtered.filter(p => p.month === activeFilter.month);
        }
        renderGallery(filtered);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        syncFilterToURL();
        updateMobileTriggerLabel();
    }

    function syncFilterToURL() {
        const params = new URLSearchParams();
        if (activeFilter.year) params.set('year', activeFilter.year);
        if (activeFilter.month) params.set('month', activeFilter.month);
        const query = params.toString();
        const newUrl = window.location.pathname + (query ? `?${query}` : '') + window.location.hash;
        history.replaceState(null, '', newUrl);
    }

    function readFilterFromURL() {
        const params = new URLSearchParams(window.location.search);
        const year = params.get('year');
        const month = params.get('month');
        return {
            year: year || null,
            month: month ? month.toUpperCase() : null
        };
    }

    function buildFilterPanel(photos, initialFilter) {
        // Build year -> months map
        const yearMap = {};
        photos.forEach(p => {
            if (!yearMap[p.year]) yearMap[p.year] = new Set();
            yearMap[p.year].add(p.month);
        });

        const panel = document.getElementById('filter-panel');
        panel.innerHTML = '';

        const wantedYear = initialFilter && initialFilter.year;
        const wantedMonth = initialFilter && initialFilter.month;

        // ALL button
        const allBtn = document.createElement('button');
        allBtn.className = 'filter-btn all' + (wantedYear ? '' : ' active');
        allBtn.textContent = 'ALL';
        allBtn.style.animationDelay = '0.1s';
        allBtn.addEventListener('click', () => {
            activeFilter = { year: null, month: null };
            // Reset all active states
            panel.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            // Close all year groups
            panel.querySelectorAll('.filter-year-group').forEach(g => g.classList.remove('open'));
            allBtn.classList.add('active');
            applyFilter();
        });
        panel.appendChild(allBtn);

        // Sort years descending
        const sortedYears = Object.keys(yearMap).sort((a, b) => b - a);

        sortedYears.forEach((year, i) => {
            const group = document.createElement('div');
            group.className = 'filter-year-group';
            group.style.animationDelay = `${0.1 + (i + 1) * 0.1}s`;

            const yearBtn = document.createElement('button');
            yearBtn.className = 'filter-btn year';
            yearBtn.textContent = year;

            const monthsDiv = document.createElement('div');
            monthsDiv.className = 'filter-months';

            // Sort months chronologically (Jan -> Dec, left to right)
            const sortedMonths = [...yearMap[year]].sort(
                (a, b) => MONTH_ORDER.indexOf(a) - MONTH_ORDER.indexOf(b)
            );

            const monthBtns = {};
            sortedMonths.forEach(month => {
                const monthBtn = document.createElement('button');
                monthBtn.className = 'filter-btn month';
                monthBtn.textContent = month;
                monthBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    activeFilter = { year, month };
                    panel.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    monthBtn.classList.add('active');
                    yearBtn.classList.add('active');
                    applyFilter();
                });
                monthBtns[month] = monthBtn;
                monthsDiv.appendChild(monthBtn);
            });

            yearBtn.addEventListener('click', () => {
                const isOpen = group.classList.contains('open');
                // Close all groups
                panel.querySelectorAll('.filter-year-group').forEach(g => g.classList.remove('open'));
                if (!isOpen) {
                    group.classList.add('open');
                    // Filter by year, clear month
                    activeFilter = { year, month: null };
                    panel.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    yearBtn.classList.add('active');
                    applyFilter();
                } else {
                    // Clicking an open year closes it and resets to all
                    activeFilter = { year: null, month: null };
                    panel.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    allBtn.classList.add('active');
                    applyFilter();
                }
            });

            group.appendChild(yearBtn);
            group.appendChild(monthsDiv);
            panel.appendChild(group);

            // Apply initial state from URL
            if (wantedYear === year) {
                group.classList.add('open');
                yearBtn.classList.add('active');
                activeFilter.year = year;
                if (wantedMonth && monthBtns[wantedMonth]) {
                    monthBtns[wantedMonth].classList.add('active');
                    activeFilter.month = wantedMonth;
                }
            }
        });
    }

    function updateMobileTriggerLabel() {
        const trigger = document.getElementById('mobile-filter-trigger');
        const label = document.getElementById('mobile-filter-label');
        if (!trigger || !label) return;

        if (!activeFilter.year) {
            label.textContent = '';
            trigger.classList.remove('has-filter');
        } else {
            label.textContent = activeFilter.month
                ? `${activeFilter.month} ${activeFilter.year}`
                : activeFilter.year;
            trigger.classList.add('has-filter');
        }
    }

    function syncMobileSheetActiveState() {
        const sheet = document.getElementById('filter-sheet');
        if (!sheet) return;
        sheet.querySelectorAll('.sheet-year-btn, .sheet-month-btn, .sheet-all-btn').forEach(b => b.classList.remove('active'));
        sheet.querySelectorAll('.sheet-year-block').forEach(g => g.classList.remove('open'));

        updateMobileTriggerLabel();

        if (!activeFilter.year) {
            document.getElementById('sheet-all-btn').classList.add('active');
            return;
        }
        const yearBlock = sheet.querySelector(`.sheet-year-block[data-year="${activeFilter.year}"]`);
        if (yearBlock) {
            yearBlock.classList.add('open');
            yearBlock.querySelector('.sheet-year-btn').classList.add('active');
            if (activeFilter.month) {
                const monthBtn = yearBlock.querySelector(`.sheet-month-btn[data-month="${activeFilter.month}"]`);
                if (monthBtn) monthBtn.classList.add('active');
            }
        }
    }

    function openFilterSheet() {
        document.getElementById('filter-sheet').classList.add('active');
        document.getElementById('sheet-backdrop').classList.add('active');
        document.getElementById('mobile-filter-trigger').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeFilterSheet() {
        document.getElementById('filter-sheet').classList.remove('active');
        document.getElementById('sheet-backdrop').classList.remove('active');
        document.getElementById('mobile-filter-trigger').classList.remove('active');
        document.body.style.overflow = 'auto';
    }

    // Swipe-to-dismiss for the filter sheet
    function initSheetSwipeToDismiss() {
        const sheet = document.getElementById('filter-sheet');
        let startY = 0;
        let currentY = 0;
        let dragging = false;

        sheet.addEventListener('touchstart', (e) => {
            // Ignore drags that start on a scrollable area already mid-scroll down
            if (sheet.scrollTop > 0) return;
            startY = e.touches[0].clientY;
            dragging = true;
            sheet.style.transition = 'none';
        }, { passive: true });

        sheet.addEventListener('touchmove', (e) => {
            if (!dragging) return;
            currentY = e.touches[0].clientY;
            const delta = currentY - startY;
            if (delta > 0) {
                sheet.style.transform = `translateY(${delta}px)`;
            }
        }, { passive: true });

        sheet.addEventListener('touchend', () => {
            if (!dragging) return;
            dragging = false;
            sheet.style.transition = '';
            sheet.style.transform = '';
            const delta = currentY - startY;
            if (delta > 80) {
                closeFilterSheet();
            }
            startY = 0;
            currentY = 0;
        });
    }

    function buildMobileFilterSheet(photos) {
        // Build year -> months map (same logic as desktop panel)
        const yearMap = {};
        photos.forEach(p => {
            if (!yearMap[p.year]) yearMap[p.year] = new Set();
            yearMap[p.year].add(p.month);
        });

        const yearsContainer = document.getElementById('sheet-years');
        yearsContainer.innerHTML = '';

        const sortedYears = Object.keys(yearMap).sort((a, b) => b - a);

        sortedYears.forEach(year => {
            const block = document.createElement('div');
            block.className = 'sheet-year-block';
            block.dataset.year = year;

            const yearBtn = document.createElement('button');
            yearBtn.className = 'sheet-year-btn';
            yearBtn.innerHTML = `<span>${year}</span><span class="sheet-chevron">▾</span>`;

            const monthsDiv = document.createElement('div');
            monthsDiv.className = 'sheet-months';

            const sortedMonths = [...yearMap[year]].sort(
                (a, b) => MONTH_ORDER.indexOf(a) - MONTH_ORDER.indexOf(b)
            );

            sortedMonths.forEach(month => {
                const monthBtn = document.createElement('button');
                monthBtn.className = 'sheet-month-btn';
                monthBtn.dataset.month = month;
                monthBtn.textContent = month;
                monthBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    activeFilter = { year, month };
                    syncFilterPanelActiveState();
                    syncMobileSheetActiveState();
                    applyFilter();
                    closeFilterSheet();
                });
                monthsDiv.appendChild(monthBtn);
            });

            yearBtn.addEventListener('click', () => {
                const isOpen = block.classList.contains('open');
                yearsContainer.querySelectorAll('.sheet-year-block').forEach(b => b.classList.remove('open'));
                if (!isOpen) {
                    block.classList.add('open');
                    activeFilter = { year, month: null };
                    syncFilterPanelActiveState();
                    syncMobileSheetActiveState();
                    block.classList.add('open');
                    applyFilter();
                } else {
                    activeFilter = { year: null, month: null };
                    syncFilterPanelActiveState();
                    syncMobileSheetActiveState();
                    applyFilter();
                }
            });

            block.appendChild(yearBtn);
            block.appendChild(monthsDiv);
            yearsContainer.appendChild(block);
        });

        document.getElementById('sheet-all-btn').addEventListener('click', () => {
            activeFilter = { year: null, month: null };
            syncFilterPanelActiveState();
            syncMobileSheetActiveState();
            applyFilter();
            closeFilterSheet();
        });

        document.getElementById('mobile-filter-trigger').addEventListener('click', openFilterSheet);
        document.getElementById('sheet-backdrop').addEventListener('click', closeFilterSheet);

        syncMobileSheetActiveState();
    }

    function syncFilterPanelActiveState() {
        const panel = document.getElementById('filter-panel');
        if (!panel) return;
        panel.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        panel.querySelectorAll('.filter-year-group').forEach(g => g.classList.remove('open'));

        if (!activeFilter.year) {
            panel.querySelector('.filter-btn.all').classList.add('active');
            return;
        }
        const groups = panel.querySelectorAll('.filter-year-group');
        groups.forEach(group => {
            const yearBtn = group.querySelector('.filter-btn.year');
            if (yearBtn && yearBtn.textContent === activeFilter.year) {
                group.classList.add('open');
                yearBtn.classList.add('active');
                if (activeFilter.month) {
                    const monthBtn = [...group.querySelectorAll('.filter-btn.month')]
                        .find(b => b.textContent === activeFilter.month);
                    if (monthBtn) monthBtn.classList.add('active');
                }
            }
        });
    }

    async function initGallery() {
        const response = await fetch('dimensions.json');
        const dims = await response.json();
        
        let photoFilenames = Object.keys(dims); 
        photoFilenames.sort(() => Math.random() - 0.5);

        allPhotos = photoFilenames.map((filename, index) => {
            const photoData = dims[filename];
            const dateParts = (photoData.date || '').split(' ');
            return {
                filename,
                ratio: photoData.ratio || 1,
                location: photoData.location || 'UNKNOWN',
                date: photoData.date || '----',
                archiveNumber: photoData.number || String(index + 1).padStart(3, '0'),
                month: dateParts[0] || '',
                year: dateParts[1] || '',
            };
        });

        const urlFilter = readFilterFromURL();
        activeFilter = { year: urlFilter.year, month: null }; // month gets set inside buildFilterPanel if valid

        buildFilterPanel(allPhotos, urlFilter);
        buildMobileFilterSheet(allPhotos);
        initSheetSwipeToDismiss();

        let initialPhotos = allPhotos;
        if (activeFilter.year) {
            initialPhotos = initialPhotos.filter(p => p.year === activeFilter.year);
        }
        if (activeFilter.month) {
            initialPhotos = initialPhotos.filter(p => p.month === activeFilter.month);
        }
        renderGallery(initialPhotos);
        
        // Check if we need to open a shared photo from URL hash
        setTimeout(() => {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (hash) {
                const targetImg = document.querySelector(`#gallery-root img[src*="${hash}"], #gallery-root img[data-src*="${hash}"]`);
                if (targetImg) {
                    targetImg.parentElement.click();
                }
            }
        }, 100);
    }

    // Lightbox close logic
    const lightbox = document.getElementById('lightbox');
    lightbox.addEventListener('click', (e) => {
        if (e.target.closest('.lb-nav-btn')) return; // don't close when clicking prev/next
        if (e.target.closest('.lightbox-ui')) return; // don't close when clicking the info bar / share button
        lightbox.classList.remove('active');
        document.body.style.overflow = 'auto';
        history.replaceState(null, null, " ");
        setTimeout(() => { document.getElementById('lightbox-img').src = ""; }, 400);
    });

    document.getElementById('lb-prev').addEventListener('click', (e) => {
        e.stopPropagation();
        showLightboxAt(currentLightboxIndex - 1);
    });
    document.getElementById('lb-next').addEventListener('click', (e) => {
        e.stopPropagation();
        showLightboxAt(currentLightboxIndex + 1);
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === "Escape" && lightbox.classList.contains('active')) {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        if (e.key === "Escape" && document.getElementById('filter-sheet').classList.contains('active')) {
            closeFilterSheet();
        }
        if (lightbox.classList.contains('active')) {
            if (e.key === "ArrowLeft") showLightboxAt(currentLightboxIndex - 1);
            if (e.key === "ArrowRight") showLightboxAt(currentLightboxIndex + 1);
        }
    });

    // Swipe gestures for lightbox (mobile): left/right = prev/next, down = dismiss
    function initLightboxSwipe() {
        const img = document.getElementById('lightbox-img');
        const track = document.getElementById('lb-track');
        let startX = 0, startY = 0;
        let dx = 0, dy = 0;
        let dragging = false;
        const SWIPE_THRESHOLD = 60;
        let pendingCompletion = null; // { newIndex, onDone } if a slide-out is still animating

        function finishPendingSwipeInstantly() {
            if (!pendingCompletion) return;
            const { newIndex, onDone } = pendingCompletion;
            track.removeEventListener('transitionend', onDone);
            pendingCompletion = null;
            track.style.transition = 'none';
            showLightboxAt(newIndex, true);
            track.style.transform = 'translateX(-100vw)';
            requestAnimationFrame(() => {
                requestAnimationFrame(() => { track.style.transition = ''; });
            });
        }

        lightbox.addEventListener('touchstart', (e) => {
            if (e.target.closest('.lb-nav-btn') || e.target.closest('#lb-share-btn')) return;
            // If a previous swipe's slide-out animation hasn't finished, apply it
            // immediately so the track's baseline is correctly -100vw before this
            // new drag's math (which assumes that baseline) begins.
            finishPendingSwipeInstantly();
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            dx = 0; dy = 0;
            dragging = true;
            img.classList.remove('swipe-hint');
            track.style.transition = 'none';
        }, { passive: true });

        lightbox.addEventListener('touchmove', (e) => {
            if (!dragging) return;
            dx = e.touches[0].clientX - startX;
            dy = e.touches[0].clientY - startY;
            // Only visually drag if horizontal intent is clear (avoid fighting page scroll)
            if (Math.abs(dx) > Math.abs(dy)) {
                // Clamp drag at boundaries so it doesn't slide into nothing
                const atFirst = currentLightboxIndex <= 0;
                const atLast = currentLightboxIndex >= currentGalleryPhotos.length - 1;
                let clampedDx = dx;
                if (atFirst && dx > 0) clampedDx = dx * 0.25; // resistance, no prev photo
                if (atLast && dx < 0) clampedDx = dx * 0.25; // resistance, no next photo
                track.style.transform = `translateX(calc(-100vw + ${clampedDx}px))`;
            }
        }, { passive: true });

        lightbox.addEventListener('touchend', () => {
            if (!dragging) return;
            dragging = false;
            track.style.transition = 'transform 0.3s ease';

            const horizontal = Math.abs(dx) > Math.abs(dy);
            const atFirst = currentLightboxIndex <= 0;
            const atLast = currentLightboxIndex >= currentGalleryPhotos.length - 1;

            if (horizontal && dx < -SWIPE_THRESHOLD && !atLast) {
                completeSwipe('translateX(-200vw)', currentLightboxIndex + 1);
            } else if (horizontal && dx > SWIPE_THRESHOLD && !atFirst) {
                completeSwipe('translateX(0)', currentLightboxIndex - 1);
            } else if (!horizontal && dy > SWIPE_THRESHOLD) {
                // swipe down to dismiss
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
                history.replaceState(null, null, " ");
                setTimeout(() => { img.src = ""; }, 400);
                track.style.transform = 'translateX(-100vw)';
            } else {
                // snap back to center
                track.style.transform = 'translateX(-100vw)';
            }
            dx = 0; dy = 0;
        });

        // Let the slide-out animation play fully (the destination slide already
        // shows the correct photo, so nothing changes visually during this).
        // Only once it's finished do we update state and re-center the track
        // instantly with no transition — an invisible swap, no second animation.
        function completeSwipe(targetTransform, newIndex) {
            track.style.transform = targetTransform;

            const onDone = () => {
                pendingCompletion = null;
                track.style.transition = 'none';
                showLightboxAt(newIndex, true);
                track.style.transform = 'translateX(-100vw)';
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => { track.style.transition = ''; });
                });
            };
            pendingCompletion = { newIndex, onDone };
            track.addEventListener('transitionend', onDone, { once: true });
        }
    }
    initLightboxSwipe();

const scrollWrapper = document.getElementById('scroll-wrapper');
const X_PAGES_THRESHOLD = 3; 

scrollWrapper.addEventListener('click', () => {
    const currentScroll = window.scrollY;
    const threshold = window.innerHeight * X_PAGES_THRESHOLD;

    if (currentScroll < threshold) {
        window.scrollBy({
            top: window.innerHeight * 0.8, 
            behavior: 'smooth'
        });
    } else {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }
});

window.addEventListener('scroll', () => {
    const winScroll = window.scrollY;
    const height = document.documentElement.scrollHeight - window.innerHeight;
    const scrolled = Math.min((winScroll / height) * 100, 100);
    
    document.getElementById("progress").style.width = scrolled + "%";

    const threshold = window.innerHeight * X_PAGES_THRESHOLD;
    
    if (winScroll > threshold) {
        scrollWrapper.classList.add('is-reversed');
    } else {
        scrollWrapper.classList.remove('is-reversed');
    }
}, { passive: true });

let lastWidth = window.innerWidth;
window.addEventListener('resize', () => {
    if (window.innerWidth !== lastWidth) {
        location.reload(); 
    }
});

document.getElementById('lb-share-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    const shareUrl = window.location.href;
    
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(shareUrl).then(confirmCopy);
    } else {
        const textArea = document.createElement("textarea");
        textArea.value = shareUrl;
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            confirmCopy();
        } catch (err) {
            console.error('Unable to copy', err);
        }
        document.body.removeChild(textArea);
    }
});

function confirmCopy() {
    const btn = document.getElementById('lb-share-btn');
    btn.textContent = "LINK COPIED";
    btn.classList.add('copied');
    setTimeout(() => {
        btn.textContent = "COPY LINK";
        btn.classList.remove('copied');
    }, 2000);
}

window.addEventListener('hashchange', () => {
    if (programmaticHashChangeCount > 0) {
        // This hash change was caused by openLightbox itself (e.g. via swipe/arrow nav) — ignore it
        programmaticHashChangeCount--;
        return;
    }
    const hash = decodeURIComponent(window.location.hash.substring(1));
    if (hash) {
        const targetImg = document.querySelector(`#gallery-root img[src*="${hash}"], #gallery-root img[data-src*="${hash}"]`);
        if (targetImg) targetImg.parentElement.click();
    } else {
        lightbox.classList.remove('active');
        document.body.style.overflow = 'auto';
    }
});

    initGallery();
